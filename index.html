<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가우스X 연습하기</title>
<style>
:root{
  --ink:#1c1c1e; --slate:#555a6a; --steel:#6b6f7e; --stone:#8e91a0;
  --canvas:#ffffff; --surface:#f7f8fa; --surface-soft:#fafbfc;
  --hairline:#e0e2e8; --hairline-soft:#eef0f3; --hairline-strong:#c7cad5;
  --brand-yellow:#ffd02f; --yellow-light:#fff4c4; --brand-blue:#4262ff;
  --coral-light:#ffc6c6; --coral-dark:#600000;
  --teal-light:#c3faf5; --moss-dark:#187574; --success:#00b473;
  --radius-md:12px; --radius-xl:20px; --radius-full:999px;
  --font:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --felt:#f4f1ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}

.topbar{display:flex;align-items:center;gap:14px;padding:9px clamp(12px,1.6vw,24px);
  border-bottom:1px solid var(--hairline-soft);background:var(--canvas)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:clamp(28px,3.6vh,46px);width:auto;display:block}
.brand h1{margin:0;font-size:clamp(16px,2.2vh,28px);font-weight:600;letter-spacing:-.5px;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:var(--radius-full);
  border:1px solid var(--hairline-soft)}
.tab{border:0;background:transparent;color:var(--steel);font-family:inherit;
  font-size:clamp(12px,1.55vh,16px);font-weight:600;padding:7px 15px;border-radius:var(--radius-full);cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-family:inherit;font-size:clamp(12px,1.5vh,15px);font-weight:600;border-radius:var(--radius-full);
  padding:9px 17px;cursor:pointer;border:1px solid transparent;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--ink);color:#fff}
.btn-sec{background:transparent;color:var(--ink);border-color:var(--hairline-strong)}
.btn-sec.on{background:var(--brand-yellow);border-color:var(--brand-yellow);color:var(--ink)}
.btn:disabled{opacity:.32;cursor:default}

.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(148px,18vw,240px);
  gap:clamp(8px,1.2vw,18px);padding:clamp(8px,1.4vh,18px) clamp(10px,1.6vw,22px);min-height:0}
.boardwrap{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.board{position:relative;background:var(--felt);border-radius:var(--radius-xl);
  box-shadow:0 12px 32px -4px rgba(5,0,56,.08);border:1px solid var(--hairline-soft);overflow:hidden}
.grid-bg{position:absolute;inset:0;opacity:.6;pointer-events:none;width:100%;height:100%}

.tray{background:var(--surface);border:1px solid var(--hairline-soft);border-radius:var(--radius-xl);
  padding:clamp(8px,1.2vh,16px);display:flex;flex-direction:column;min-height:0;min-width:0}
.tray-title{font-size:clamp(11px,1.4vh,14px);font-weight:700;color:var(--steel);
  text-align:center;margin-bottom:4px}
.slots{flex:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center;min-height:0}
.slot{border-radius:var(--radius-md);flex:none}
.tray-foot{display:flex;flex-direction:column;gap:6px;align-items:stretch;margin-top:8px}
.tray-hint{margin:0;text-align:center;font-size:clamp(10px,1.25vh,13px);color:var(--stone);line-height:1.4}

.statusbar{display:flex;align-items:center;gap:8px;padding:8px clamp(12px,1.6vw,24px);
  border-top:1px solid var(--hairline-soft);background:var(--surface-soft);overflow:hidden}
.tag{font-size:clamp(10px,1.3vh,13px);font-weight:700;border-radius:var(--radius-full);padding:4px 11px;white-space:nowrap}
.tag-y{background:var(--yellow-light);color:#746019}
.tag-t{background:var(--teal-light);color:var(--moss-dark)}
.tag-c{background:var(--coral-light);color:var(--coral-dark)}
.msg{margin-left:auto;font-size:clamp(12px,1.6vh,17px);font-weight:600;color:var(--steel);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.msg.ok{color:var(--success)}
.msg.no{color:#c0392b}

#layer{position:fixed;inset:0;pointer-events:none;z-index:40}
.chip{position:absolute;left:0;top:0;pointer-events:auto;cursor:grab;
  transform-origin:50% 50%;display:flex;align-items:center;justify-content:center;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),filter .15s ease}
.chip.nomove{transition:filter .15s ease}
.chip.fix{cursor:default}
.chip.drag{cursor:grabbing;transition:none;z-index:80;filter:drop-shadow(0 14px 22px rgba(40,25,10,.34))}
.chip.pending .tile{box-shadow:inset 0 2px 0 rgba(255,246,228,.75),inset 0 -3px 0 rgba(133,88,42,.28),
  0 0 0 3px var(--brand-blue),0 3px 5px rgba(70,45,20,.2)}
.chip.bad .tile{box-shadow:inset 0 2px 0 rgba(255,246,228,.75),inset 0 -3px 0 rgba(133,88,42,.28),
  0 0 0 3px #d0342c,0 3px 5px rgba(70,45,20,.2)}
.chip.win .tile{box-shadow:inset 0 2px 0 rgba(255,246,228,.75),inset 0 -3px 0 rgba(133,88,42,.28),
  0 0 0 3px var(--success),0 3px 5px rgba(70,45,20,.2)}
.tile{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12%;
  background:
    repeating-linear-gradient(93deg, rgba(120,78,36,.09) 0 1px, rgba(120,78,36,0) 1px 5px),
    repeating-linear-gradient(87deg, rgba(158,110,56,.12) 0 2px, rgba(158,110,56,0) 2px 13px),
    repeating-linear-gradient(90deg, rgba(92,58,24,.05) 0 1px, rgba(92,58,24,0) 1px 27px),
    linear-gradient(158deg,#eccfa4 0%,#e4be8b 40%,#d9ae79 72%,#e3bf8e 100%);
  box-shadow:inset 0 2px 0 rgba(255,246,228,.75), inset 0 -3px 0 rgba(133,88,42,.28),
             inset 0 0 0 1px rgba(133,88,42,.20), 0 3px 5px rgba(70,45,20,.2)}
.tile b{font-weight:800;line-height:1;letter-spacing:-.04em;text-shadow:0 1px 0 rgba(255,250,240,.5)}
.tile b.u{text-decoration:underline;text-decoration-thickness:.085em;text-underline-offset:.08em}
.hintcell{position:absolute;border:2px dashed var(--brand-blue);opacity:.4;border-radius:10%;
  pointer-events:none;background:rgba(66,98,255,.05)}

.verdict{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;z-index:90;pointer-events:none}
.verdict.show{display:flex}
.vmark{width:clamp(84px,15vh,160px);height:clamp(84px,15vh,160px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:clamp(46px,8.4vh,92px);font-weight:800;line-height:1;
  box-shadow:0 14px 34px -6px rgba(5,0,56,.28);animation:pop .22s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.vmark.ok{background:var(--success)}
.vmark.no{background:#d0342c}
.vtext{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--radius-full);
  padding:8px 22px;font-size:clamp(15px,2.4vh,30px);font-weight:700;letter-spacing:-.3px;
  box-shadow:0 8px 20px -6px rgba(5,0,56,.16)}
.vtext.sub{font-size:clamp(12px,1.8vh,19px);font-weight:600;color:var(--slate)}
.vbtn{pointer-events:auto;font-size:clamp(13px,1.9vh,20px)!important;padding:10px 26px!important}
.vrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:auto}
.peekbar{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:8px;align-items:center;
  justify-content:center;z-index:95;pointer-events:none}
.peekbar .btn{pointer-events:auto;font-size:clamp(12px,1.7vh,16px);padding:8px 16px;
  background:rgba(255,255,255,.92)}
.peekbar .btn-pri{background:var(--ink)}

@media (max-aspect-ratio: 1/1){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .tray{padding:8px 10px}
  .slots{flex-direction:row;justify-content:space-around;width:100%}
  .tray-foot{flex-direction:row;align-items:center;justify-content:center;gap:14px;margin-top:6px}
  .tray-title{display:none}
}
@media (max-width:620px){
  .brand h1{font-size:15px}
  .actions .btn{padding:8px 11px}
  .tab{padding:7px 10px;font-size:12px}
  .tag{display:none}
}
</style>
</head>

<script>
"use strict";
/* 가우스X : 칩=1x2 나무 조각(수 n, 배수 n*k) / 한 줄 세 칸이 a x b = c / 긴 면끼리 붙지 않음 */
var DIRS=[[0,1],[1,0],[0,-1],[-1,0]];
var ROT={"0,1":0,"1,0":90,"0,-1":180,"-1,0":270};
var COLORS=["#1c1c1e","#5a4fd6","#d07d12","#1a8a5a","#cf3b2f","#3a9ad9","#7b8089","#b8409a"];

function ri(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[ri(a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=ri(i+1),t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function key(r,c){ return r+","+c; }

function validTriple(t0,t1,t2){
  if(t0*t1===t2 && t0<=9 && t1<=9) return true;
  if(t2*t1===t0 && t2<=9 && t1<=9) return true;
  return false;
}
function chipOk(a,b){
  var lo=Math.min(a,b), hi=Math.max(a,b);
  return lo>=1 && hi%lo===0 && hi/lo<=9 && lo<=9 && hi<=81;
}
function attachments(w){
  var out=[],m;
  if(w<=9){ for(m=1;m<=9;m++){ if(chipOk(m,w*m)) out.push([m,w*m]); } }
  for(m=1;m<=9;m++){ if(w%m===0 && (w/m)<=9 && chipOk(m,w/m)) out.push([m,w/m]); }
  return out;
}

function newBoard(){ return {cells:{},chips:[]}; }
function cellAt(b,r,c){ return b.cells[key(r,c)]||null; }
function freeAt(b,r,c){ return !b.cells[key(r,c)]; }
function longFaceOkB(b,r,c,d){
  var e=[d[1],-d[0]],i,s,A,B;
  for(i=0;i<2;i++){
    s=(i===0)?e:[-e[0],-e[1]];
    A=cellAt(b,r+s[0],c+s[1]); B=cellAt(b,r+d[0]+s[0],c+d[1]+s[1]);
    if(A&&B&&A.id===B.id) return false;
  }
  return true;
}
function normPlace(r,c,d,v0,v1){
  if(d[0]<0||d[1]<0) return {r:r+d[0],c:c+d[1],d:[-d[0],-d[1]],v0:v1,v1:v0};
  return {r:r,c:c,d:d,v0:v0,v1:v1};
}
function placeChip(b,r,c,d,v0,v1,id){
  var nz=normPlace(r,c,d,v0,v1);
  r=nz.r; c=nz.c; d=nz.d; v0=nz.v0; v1=nz.v1;
  b.cells[key(r,c)]={v:v0,id:id};
  b.cells[key(r+d[0],c+d[1])]={v:v1,id:id};
  b.chips.push({id:id,r:r,c:c,d:d,v:[v0,v1]});
}
function bbox(b){
  var rs=[],cs=[],k;
  for(k in b.cells){ var p=k.split(","); rs.push(+p[0]); cs.push(+p[1]); }
  b.minR=Math.min.apply(null,rs); b.minC=Math.min.apply(null,cs);
  b.h=Math.max.apply(null,rs)-b.minR+1; b.w=Math.max.apply(null,cs)-b.minC+1;
  return b;
}

function growBoard(nChips,maxR,maxC){
  for(var attempt=0;attempt<500;attempt++){
    var b=newBoard();
    var n=1+ri(9), k=2+ri(8);
    if(!chipOk(n,n*k)) continue;
    placeChip(b,0,0,pick(DIRS),n,n*k,0);
    var ok=true;
    for(var i=1;i<nChips;i++){
      var cands=[],ci,q,di,ai;
      for(ci=0;ci<b.chips.length;ci++){
        var ch=b.chips[ci];
        var cells=[[ch.r,ch.c],[ch.r+ch.d[0],ch.c+ch.d[1]]];
        for(q=0;q<2;q++){
          var cell=cells[q], w=cellAt(b,cell[0],cell[1]).v;
          for(di=0;di<4;di++){
            var d=DIRS[di];
            var r1=cell[0]+d[0], c1=cell[1]+d[1];
            var r2=cell[0]+2*d[0], c2=cell[1]+2*d[1];
            if(!freeAt(b,r1,c1)||!freeAt(b,r2,c2)) continue;
            if(!longFaceOkB(b,r1,c1,d)) continue;
            var att=attachments(w);
            for(ai=0;ai<att.length;ai++) cands.push({r:r1,c:c1,d:d,near:att[ai][0],far:att[ai][1]});
          }
        }
      }
      if(!cands.length){ ok=false; break; }
      var pk=pick(cands);
      placeChip(b,pk.r,pk.c,pk.d,pk.near,pk.far,i);
    }
    if(!ok) continue;
    bbox(b);
    if(b.h>maxR||b.w>maxC) continue;
    return b;
  }
  return null;
}
function isBranching(b){
  var horiz=false,vert=false,i;
  for(i=0;i<b.chips.length;i++){ if(b.chips[i].d[0]===0) horiz=true; else vert=true; }
  return horiz&&vert&&b.h>=3&&b.w>=3;
}

/* ---------- 배치 판정 : 어느 방향이든 한 줄 세 칸이 곱셈식이면 연결 성공 ---------- */
var AXES=[[0,1],[1,0]];
function evalPlace(getCell,r,c,d,v0,v1){
  var p0=[r,c], p1=[r+d[0],c+d[1]], i, sgn, A, B, di, q, p;
  function isSelf(rr,cc){
    return (rr===p0[0]&&cc===p0[1])||(rr===p1[0]&&cc===p1[1]);
  }
  var touch=false;
  for(i=0;i<2;i++){
    p=(i===0)?p0:p1;
    for(di=0;di<4;di++){
      q=[p[0]+DIRS[di][0], p[1]+DIRS[di][1]];
      if(isSelf(q[0],q[1])) continue;
      if(getCell(q[0],q[1])) touch=true;
    }
  }
  if(!touch) return {ok:false,reason:"touch"};
  var e=[d[1],-d[0]];
  for(i=0;i<2;i++){
    sgn=(i===0)?e:[-e[0],-e[1]];
    A=getCell(p0[0]+sgn[0],p0[1]+sgn[1]);
    B=getCell(p1[0]+sgn[0],p1[1]+sgn[1]);
    if(A&&B&&A.id===B.id) return {ok:false,reason:"longface"};
  }
  function findEq(a0,a1){
    function V(rr,cc){
      if(rr===p0[0]&&cc===p0[1]) return a0;
      if(rr===p1[0]&&cc===p1[1]) return a1;
      var g=getCell(rr,cc);
      return g?g.v:null;
    }
    var ci,ai,off,u,pp,t0,t1,t2;
    for(ci=0;ci<2;ci++){
      pp=(ci===0)?p0:p1;
      for(ai=0;ai<2;ai++){
        u=AXES[ai];
        for(off=-2;off<=0;off++){
          t0=V(pp[0]+off*u[0], pp[1]+off*u[1]);
          t1=V(pp[0]+(off+1)*u[0], pp[1]+(off+1)*u[1]);
          t2=V(pp[0]+(off+2)*u[0], pp[1]+(off+2)*u[1]);
          if(t0===null||t1===null||t2===null) continue;
          if(validTriple(t0,t1,t2)) return [t0,t1,t2];
        }
      }
    }
    return null;
  }
  var eq=findEq(v0,v1);
  if(eq) return {ok:true,eq:eq};
  if(findEq(v1,v0)) return {ok:false,reason:"turn"};
  return {ok:false,reason:"mult"};
}
function boardGetter(b){
  return function(r,c){ return b.cells[key(r,c)]||null; };
}
function canConnect(b,rows,cols,a,bb){
  var get=boardGetter(b),r,c,ai,d,r2,c2,oi,v0,v1,res;
  for(r=0;r<rows;r++){
    for(c=0;c<cols;c++){
      for(ai=0;ai<2;ai++){
        d=AXES[ai]; r2=r+d[0]; c2=c+d[1];
        if(r2>=rows||c2>=cols) continue;
        if(get(r,c)||get(r2,c2)) continue;
        for(oi=0;oi<2;oi++){
          v0=(oi===0)?a:bb; v1=(oi===0)?bb:a;
          res=evalPlace(get,r,c,d,v0,v1);
          if(res.ok) return true;
        }
      }
    }
  }
  return false;
}
function samePair(p,q){
  return Math.min(p[0],p[1])===Math.min(q[0],q[1]) && Math.max(p[0],p[1])===Math.max(q[0],q[1]);
}
function buildProblem(stage){
  var boardChips=(stage===1)?1:(stage===2)?2:(4+ri(2));
  var maxR=(stage===1)?3:(stage===2)?4:5, maxC=maxR;
  for(var t=0;t<400;t++){
    var b=growBoard(boardChips+1,maxR,maxC);
    if(!b) continue;
    var ansRaw=b.chips[b.chips.length-1];
    var keep=b.chips.slice(0,boardChips);
    var nb=newBoard(),i;
    for(i=0;i<keep.length;i++) placeChip(nb,keep[i].r,keep[i].c,keep[i].d,keep[i].v[0],keep[i].v[1],i);
    bbox(nb);
    if(stage===3&&!isBranching(nb)) continue;
    var side=Math.max(nb.h,nb.w)+4;
    var rows=side, cols=side;
    var offR=Math.floor((rows-nb.h)/2)-nb.minR, offC=Math.floor((cols-nb.w)/2)-nb.minC;
    var gb=newBoard();
    for(i=0;i<keep.length;i++) placeChip(gb,keep[i].r+offR,keep[i].c+offC,keep[i].d,keep[i].v[0],keep[i].v[1],i);
    bbox(gb);
    var ar=ansRaw.r+offR, ac=ansRaw.c+offC;
    var ar2=ar+ansRaw.d[0], ac2=ac+ansRaw.d[1];
    if(ar<0||ac<0||ar>=rows||ac>=cols) continue;
    if(ar2<0||ac2<0||ar2>=rows||ac2>=cols) continue;
    if(!evalPlace(boardGetter(gb),ar,ac,ansRaw.d,ansRaw.v[0],ansRaw.v[1]).ok) continue;
    var pool=[],n,k;
    for(n=1;n<=9;n++){
      for(k=1;k<=9;k++){ if(chipOk(n,n*k)) pool.push([n,n*k]); }
    }
    shuffle(pool);
    var ds=[],j,z,dup;
    for(j=0;j<pool.length&&ds.length<3;j++){
      if(samePair(pool[j],ansRaw.v)) continue;
      dup=false;
      for(z=0;z<ds.length;z++){ if(samePair(ds[z],pool[j])) dup=true; }
      if(dup) continue;
      if(canConnect(gb,rows,cols,pool[j][0],pool[j][1])) continue;
      ds.push(pool[j]);
    }
    if(ds.length<3) continue;
    var ansPair=(Math.random()<0.5)?[ansRaw.v[0],ansRaw.v[1]]:[ansRaw.v[1],ansRaw.v[0]];
    var tray=[{v:ansPair,ok:true}];
    for(i=0;i<3;i++) tray.push({v:(Math.random()<0.5?ds[i]:[ds[i][1],ds[i][0]]),ok:false});
    shuffle(tray);
    return {stage:stage,board:gb,tray:tray,cols:cols,rows:rows};
  }
  return null;
}

/* ---------- 상태 ---------- */
var S={stage:1,prob:null,chips:[],grid:{},cell:60,traySize:60,hint:false,locked:false,pendingId:-1,
       peek:false,resultChipId:-1,found:[],lastOk:false,lastMain:"",lastSub:""};
var $board=document.getElementById("board"), $wrap=document.getElementById("boardwrap"),
    $slots=document.getElementById("slots"), $layer=document.getElementById("layer"),
    $msg=document.getElementById("msg"), $verdict=document.getElementById("verdict"),
    $check=document.getElementById("btnCheck"), $gridbg=document.getElementById("gridbg");

function setMsg(text,kind){ $msg.textContent=text; $msg.className="msg"+(kind?" "+kind:""); }

function digitHTML(v,size,color){
  var s=String(v);
  var fs=(s.length>=2)?size*0.45:size*0.56;
  var cls=(s==="6"||s==="9")?' class="u"':"";
  return '<b'+cls+' style="font-size:'+fs.toFixed(1)+'px;color:'+color+'">'+s+'</b>';
}
function buildChipEl(chip){
  var el=document.createElement("div");
  el.className="chip"+(chip.fixed?" fix":"");
  el.dataset.id=chip.id;
  var t0=document.createElement("div"), t1=document.createElement("div");
  t0.className="tile"; t1.className="tile";
  el.appendChild(t0); el.appendChild(t1);
  chip.el=el; chip.t0=t0; chip.t1=t1;
  $layer.appendChild(el);
  el.addEventListener("pointerdown",onDown);
}
function gapFor(size){ return Math.max(2,Math.round(size*0.055)); }
function sizeChip(chip,size){
  chip.size=size;
  var gap=gapFor(size);
  chip.el.style.width=(size*2+gap)+"px";
  chip.el.style.height=size+"px";
  chip.el.style.gap=gap+"px";
  chip.t0.style.width=size+"px"; chip.t0.style.height=size+"px";
  chip.t1.style.width=size+"px"; chip.t1.style.height=size+"px";
  chip.t0.innerHTML=digitHTML(chip.v[0],size,chip.color);
  chip.t1.innerHTML=digitHTML(chip.v[1],size,chip.color);
}
function moveChip(chip,x,y,rot,anim){
  chip.x=x; chip.y=y; chip.rot=rot;
  if(!anim) chip.el.classList.add("nomove");
  chip.el.style.transform="translate(-50%,-50%) translate("+x+"px,"+y+"px) rotate("+rot+"deg)";
  if(!anim){ void chip.el.offsetWidth; chip.el.classList.remove("nomove"); }
}
function dirFromRot(rot){
  var r=((rot%360)+360)%360;
  if(r===0) return [0,1];
  if(r===90) return [1,0];
  if(r===180) return [0,-1];
  return [-1,0];
}

function layout(){
  if(!S.prob) return;
  var cols=S.prob.cols, rows=S.prob.rows;
  var wr=$wrap.getBoundingClientRect();
  var pad=Math.min(wr.width,wr.height)*0.035;
  var cell=Math.floor(Math.min((wr.width-pad*2)/cols,(wr.height-pad*2)/rows));
  S.cell=Math.max(20,cell);
  $board.style.width=(S.cell*cols)+"px";
  $board.style.height=(S.cell*rows)+"px";
  drawGrid(cols,rows,S.cell);
  var sl=$slots.getBoundingClientRect();
  var portrait=window.matchMedia("(max-aspect-ratio: 1/1)").matches;
  var ts = portrait ? Math.min((sl.width/4)*0.44, sl.height*0.78)
                    : Math.min(sl.width*0.44, (sl.height/4)*0.76);
  S.traySize=Math.max(18,Math.min(Math.floor(ts),S.cell));
  var i;
  for(i=0;i<$slots.children.length;i++){
    $slots.children[i].style.width=(S.traySize*2+gapFor(S.traySize))+"px";
    $slots.children[i].style.height=S.traySize+"px";
  }
  positionAll();
}
function drawGrid(cols,rows,cell){
  var s="",c,r;
  for(c=1;c<cols;c++) s+='<line x1="'+(c*cell)+'" y1="0" x2="'+(c*cell)+'" y2="'+(rows*cell)+'"/>';
  for(r=1;r<rows;r++) s+='<line x1="0" y1="'+(r*cell)+'" x2="'+(cols*cell)+'" y2="'+(r*cell)+'"/>';
  $gridbg.setAttribute("viewBox","0 0 "+(cols*cell)+" "+(rows*cell));
  $gridbg.innerHTML='<g stroke="#ddd6c9" stroke-width="1">'+s+'</g>';
}
function cellCenter(r,c){
  var b=$board.getBoundingClientRect();
  return {x:b.left+(c+0.5)*S.cell, y:b.top+(r+0.5)*S.cell};
}
function chipCenterFor(r,c,d,size){
  var a=cellCenter(r,c), g=gapFor(size);
  return {x:a.x+d[1]*(size+g)/2, y:a.y+d[0]*(size+g)/2};
}
function positionAll(){
  S.chips.forEach(function(ch){
    if(ch.where==="board"){
      sizeChip(ch,S.cell);
      var p=chipCenterFor(ch.r,ch.c,ch.d,S.cell);
      moveChip(ch,p.x,p.y,ROT[ch.d[0]+","+ch.d[1]],false);
    }else{
      sizeChip(ch,S.traySize);
      var rect=$slots.children[ch.slot].getBoundingClientRect();
      moveChip(ch,rect.left+rect.width/2,rect.top+rect.height/2,ch.rot||0,false);
    }
  });
  renderHints();
}

function clearAll(){
  S.chips.forEach(function(c){ if(c.el&&c.el.parentNode) c.el.parentNode.removeChild(c.el); });
  S.chips=[]; $slots.innerHTML="";
  var hs=$layer.querySelectorAll(".hintcell"),i;
  for(i=0;i<hs.length;i++) hs[i].parentNode.removeChild(hs[i]);
  hidePeek();
  $verdict.classList.remove("show"); $verdict.innerHTML="";
  S.locked=false; S.peek=false; S.pendingId=-1; S.resultChipId=-1; S.found=[];
  S.lastMain=""; $check.disabled=true;
}
function renderProblem(){
  clearAll();
  var p=S.prob, id=0, i;
  var offR=Math.floor((p.rows-p.board.h)/2)-p.board.minR;
  var offC=Math.floor((p.cols-p.board.w)/2)-p.board.minC;
  p.board.chips.forEach(function(bc,idx){
    var ch={id:id++,v:[bc.v[0],bc.v[1]],color:COLORS[idx%COLORS.length],where:"board",
            r:bc.r+offR,c:bc.c+offC,d:bc.d,fixed:true,problem:true};
    buildChipEl(ch); S.chips.push(ch);
  });
  for(i=0;i<4;i++){
    var slot=document.createElement("div");
    slot.className="slot"; $slots.appendChild(slot);
  }
  p.tray.forEach(function(tc,idx){
    var ch={id:id++,v:[tc.v[0],tc.v[1]],color:COLORS[(idx+4)%COLORS.length],where:"tray",
            slot:idx,rot:0,d:[0,1],fixed:false,problem:false,isAnswer:tc.ok};
    buildChipEl(ch); S.chips.push(ch);
  });
  rebuildGrid();
  layout();
  setMsg("칩을 끌어서 게임판에 연결해 보세요.");
}
function rebuildGrid(){
  var g={};
  S.chips.forEach(function(ch){
    if(ch.where!=="board") return;
    g[key(ch.r,ch.c)]={v:ch.v[0],id:ch.id};
    g[key(ch.r+ch.d[0],ch.c+ch.d[1])]={v:ch.v[1],id:ch.id};
  });
  S.grid=g;
}
function gVal(r,c){ return S.grid[key(r,c)]?S.grid[key(r,c)].v:null; }

function renderHints(){
  var hs=$layer.querySelectorAll(".hintcell"),i;
  for(i=0;i<hs.length;i++) hs[i].parentNode.removeChild(hs[i]);
  if(!S.hint||S.locked||!S.prob) return;
  var seen={},k;
  for(k in S.grid){
    var p=k.split(","),r=+p[0],c=+p[1],di;
    for(di=0;di<4;di++){
      var r1=r+DIRS[di][0], c1=c+DIRS[di][1];
      if(gVal(r1,c1)!==null) continue;
      if(r1<0||c1<0||r1>=S.prob.rows||c1>=S.prob.cols) continue;
      if(seen[key(r1,c1)]) continue;
      seen[key(r1,c1)]=1;
      var el=document.createElement("div"), ctr=cellCenter(r1,c1), sz=S.cell*0.82;
      el.className="hintcell";
      el.style.width=sz+"px"; el.style.height=sz+"px";
      el.style.left=(ctr.x-sz/2)+"px"; el.style.top=(ctr.y-sz/2)+"px";
      $layer.appendChild(el);
    }
  }
}

var drag=null;
function chipById(id){ for(var i=0;i<S.chips.length;i++){ if(S.chips[i].id===id) return S.chips[i]; } return null; }
function onDown(e){
  if(S.locked) return;
  var ch=chipById(+e.currentTarget.dataset.id);
  if(!ch||ch.fixed) return;
  e.preventDefault();
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  if(ch.where==="tray"&&S.traySize!==S.cell){ sizeChip(ch,S.cell); moveChip(ch,ch.x,ch.y,ch.rot,false); }
  drag={ch:ch,sx:e.clientX,sy:e.clientY,ox:ch.x,oy:ch.y,moved:false};
  ch.el.classList.add("drag");
  document.addEventListener("pointermove",onMove,{passive:false});
  document.addEventListener("pointerup",onUp);
  document.addEventListener("pointercancel",onUp);
}
function onMove(e){
  if(!drag) return;
  e.preventDefault();
  var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.abs(dx)+Math.abs(dy)>8) drag.moved=true;
  if(drag.moved) moveChip(drag.ch,drag.ox+dx,drag.oy+dy,drag.ch.rot,false);
}
function onUp(){
  if(!drag) return;
  document.removeEventListener("pointermove",onMove);
  document.removeEventListener("pointerup",onUp);
  document.removeEventListener("pointercancel",onUp);
  var ch=drag.ch, moved=drag.moved;
  ch.el.classList.remove("drag");
  drag=null;
  if(!moved){ rotateChip(ch); return; }
  dropChip(ch);
}
function inBounds(r,c){ return r>=0&&c>=0&&r<S.prob.rows&&c<S.prob.cols; }
function occupiedBy(r,c,ignoreId){
  var g=S.grid[key(r,c)];
  return (g&&g.id!==ignoreId)?g.id:null;
}
function rotateChip(ch){
  var rot=(((ch.rot||0)+90)%360), d=dirFromRot(rot);
  if(ch.where==="board"){
    var r=ch.r,c=ch.c,r2=r+d[0],c2=c+d[1];
    if(!inBounds(r2,c2)||occupiedBy(r2,c2,ch.id)!==null){
      var cells=[[ch.r+ch.d[0],ch.c+ch.d[1]]];
      var ar=cells[0][0]-d[0], ac=cells[0][1]-d[1];
      if(inBounds(ar,ac)&&inBounds(cells[0][0],cells[0][1])&&occupiedBy(ar,ac,ch.id)===null){
        r=ar; c=ac;
      }else{
        setMsg("그 방향으로는 돌릴 자리가 없어요.");
        return;
      }
    }
    ch.rot=rot; ch.d=d; ch.r=r; ch.c=c;
    var p=chipCenterFor(r,c,d,S.cell);
    moveChip(ch,p.x,p.y,rot,true);
    ch.el.classList.remove("win","bad");
    if(!ch.fixed){ ch.el.classList.add("pending"); S.pendingId=ch.id; $check.disabled=false; }
    rebuildGrid(); renderHints(); peekEdited();
  }else{
    ch.rot=rot; ch.d=d;
    moveChip(ch,ch.x,ch.y,rot,true);
  }
  setMsg("칩을 90° 돌렸어요. (현재 "+rot+"°)");
}
function snapToGrid(ch){
  var b=$board.getBoundingClientRect(), d=dirFromRot(ch.rot), g=gapFor(S.cell);
  var ax=ch.x-d[1]*(S.cell+g)/2, ay=ch.y-d[0]*(S.cell+g)/2;
  var c=Math.round((ax-b.left)/S.cell-0.5), r=Math.round((ay-b.top)/S.cell-0.5);
  var r2=r+d[0], c2=c+d[1];
  if(r<0) r=0; if(c<0) c=0;
  if(r>S.prob.rows-1) r=S.prob.rows-1;
  if(c>S.prob.cols-1) c=S.prob.cols-1;
  r2=r+d[0]; c2=c+d[1];
  if(r2<0){ r-=r2; } if(c2<0){ c-=c2; }
  if(r2>S.prob.rows-1) r-=(r2-(S.prob.rows-1));
  if(c2>S.prob.cols-1) c-=(c2-(S.prob.cols-1));
  ch.r=r; ch.c=c; ch.d=d;
  var p=chipCenterFor(r,c,d,S.cell);
  moveChip(ch,p.x,p.y,ch.rot,true);
}
function toTray(ch,anim){
  ch.where="tray";
  ch.el.classList.remove("pending","bad","win");
  sizeChip(ch,S.traySize);
  var rect=$slots.children[ch.slot].getBoundingClientRect();
  moveChip(ch,rect.left+rect.width/2,rect.top+rect.height/2,ch.rot,anim!==false);
  if(S.pendingId===ch.id){ S.pendingId=-1; $check.disabled=true; }
  ch.el.classList.remove("fix");
  rebuildGrid(); renderHints(); peekEdited();
}
function dropChip(ch){
  var b=$board.getBoundingClientRect();
  if(ch.x<b.left-S.cell||ch.x>b.right+S.cell||ch.y<b.top-S.cell||ch.y>b.bottom+S.cell){
    toTray(ch); setMsg("칩을 게임판 위에 놓아 주세요."); return;
  }
  snapToGrid(ch);
  if(occupiedBy(ch.r,ch.c,ch.id)!==null||occupiedBy(ch.r+ch.d[0],ch.c+ch.d[1],ch.id)!==null){
    toTray(ch); setMsg("이미 칩이 있는 자리예요.","no"); return;
  }
  S.chips.forEach(function(o){ if(o.id!==ch.id&&!o.fixed&&o.where==="board") toTray(o); });
  ch.where="board";
  ch.el.classList.remove("win","bad");
  ch.el.classList.add("pending");
  S.pendingId=ch.id; $check.disabled=false;
  rebuildGrid(); renderHints(); peekEdited();
  setMsg("탭하면 90° 회전 · 다 되면 ‘확인’을 누르세요.");
}

function judgeChip(ch){
  var get=function(r,c){
    var g=S.grid[key(r,c)];
    return (g&&g.id!==ch.id)?g:null;
  };
  var res=evalPlace(get,ch.r,ch.c,ch.d,ch.v[0],ch.v[1]);
  if(res.ok) return {ok:true,eq:eqText(res.eq)};
  return res;
}
function eqText(t){
  if(t[0]*t[1]===t[2]) return t[0]+" × "+t[1]+" = "+t[2];
  return t[2]+" × "+t[1]+" = "+t[0];
}
function placeSig(ch){
  var a=ch.r+","+ch.c+":"+ch.v[0];
  var b=(ch.r+ch.d[0])+","+(ch.c+ch.d[1])+":"+ch.v[1];
  return (a<b)?(a+"|"+b):(b+"|"+a);
}
function doCheck(){
  if(S.pendingId<0) return;
  var ch=chipById(S.pendingId), res=judgeChip(ch);
  if(res.reason==="touch"){ setMsg("아직 다른 칩에 닿지 않았어요. 이어 붙여 보세요."); return; }
  hidePeek();
  S.resultChipId=ch.id; S.peek=false; S.locked=true; $check.disabled=true;
  ch.el.classList.remove("pending");
  if(res.ok){
    var sig=placeSig(ch), fresh=(S.found.indexOf(sig)<0);
    if(fresh) S.found.push(sig);
    ch.el.classList.remove("bad"); ch.el.classList.add("win");
    ch.fixed=true; ch.el.classList.add("fix");
    renderHints();
    var sub=(!fresh)?"이미 찾은 배치예요."
           :(S.found.length>1)?("또 다른 정답 배치예요!  지금까지 "+S.found.length+"가지")
           :"규칙에 맞게 연결했어요!";
    showVerdict(true,res.eq,sub);
  }else{
    ch.el.classList.remove("win"); ch.el.classList.add("bad");
    showVerdict(false,"아쉬워요, 다시 해 볼까요?","");
  }
}
function mkBtn(label,pri,fn){
  var b=document.createElement("button");
  b.className="btn "+(pri?"btn-pri":"btn-sec")+" vbtn";
  b.textContent=label;
  b.addEventListener("click",fn);
  return b;
}
function showVerdict(ok,main,sub){
  S.lastOk=ok; S.lastMain=main; S.lastSub=sub||"";
  $verdict.innerHTML='<div class="vmark '+(ok?"ok":"no")+'">'+(ok?"✓":"✕")+'</div>'+
    '<div class="vtext">'+main+'</div>'+(sub?'<div class="vtext sub">'+sub+'</div>':"");
  var row=document.createElement("div");
  row.className="vrow";
  row.appendChild(mkBtn(ok?"다른 배치 해보기":"게임판 보기",false,peekBoard));
  row.appendChild(ok?mkBtn("다음 문제",true,newProblem):mkBtn("다시하기",true,resetProblem));
  $verdict.appendChild(row);
  $verdict.classList.add("show");
  setMsg(ok?("성공!  "+main):main, ok?"ok":"no");
}
function showResult(){
  if(!S.lastMain) return;
  hidePeek();
  S.peek=false; S.locked=true; S.pendingId=-1; $check.disabled=true;
  var ch=chipById(S.resultChipId);
  if(ch&&ch.where==="board"&&S.lastOk){ ch.fixed=true; ch.el.classList.add("fix"); }
  renderHints();
  showVerdict(S.lastOk,S.lastMain,S.lastSub);
}
function peekBoard(){
  $verdict.classList.remove("show"); $verdict.innerHTML="";
  S.peek=true; S.locked=false;
  var ch=chipById(S.resultChipId);
  if(ch&&ch.where==="board"){
    ch.fixed=false; ch.el.classList.remove("fix");
    S.pendingId=ch.id; $check.disabled=false;
  }
  renderHints();
  showPeek(true);
  setMsg("칩을 옮기거나 탭해서 돌린 뒤 ‘확인’을 누르면 다시 판정해요.");
}
function showPeek(withResult){
  hidePeek();
  var bar=document.createElement("div");
  bar.className="peekbar"; bar.id="peekbar";
  if(withResult) bar.appendChild(mkBtn("결과 다시 보기",false,showResult));
  bar.appendChild(mkBtn(S.lastOk?"다음 문제":"다시하기",true,S.lastOk?newProblem:resetProblem));
  $wrap.appendChild(bar);
}
function hidePeek(){
  var el=document.getElementById("peekbar");
  if(el&&el.parentNode) el.parentNode.removeChild(el);
}
function peekEdited(){
  if(!S.peek) return;
  showPeek(false);
}
function resetProblem(){
  hidePeek();
  $verdict.classList.remove("show"); $verdict.innerHTML="";
  S.locked=false; S.peek=false; S.resultChipId=-1;
  S.chips.forEach(function(ch){
    if(ch.problem) return;
    ch.fixed=false;
    ch.el.classList.remove("fix","win","bad","pending");
    ch.rot=0; ch.d=[0,1];
    toTray(ch,true);
  });
  S.pendingId=-1; $check.disabled=true;
  rebuildGrid(); renderHints();
  setMsg("다시 해 볼까요? 칩을 끌어서 연결해 보세요.");
}
function newProblem(){
  var p=buildProblem(S.stage);
  if(!p){ setMsg("문제를 만들지 못했어요. 다시 눌러 주세요.","no"); return; }
  S.prob=p; renderProblem();
}

var tabs=document.querySelectorAll(".tab"),ti;
for(ti=0;ti<tabs.length;ti++){
  tabs[ti].addEventListener("click",function(){
    var i;
    for(i=0;i<tabs.length;i++) tabs[i].classList.remove("on");
    this.classList.add("on");
    S.stage=+this.dataset.stage;
    newProblem();
  });
}
document.getElementById("btnNew").addEventListener("click",newProblem);
document.getElementById("btnRetry").addEventListener("click",function(){ renderProblem(); });
document.getElementById("btnHint").addEventListener("click",function(){
  S.hint=!S.hint;
  this.classList.toggle("on",S.hint);
  renderHints();
});
$check.addEventListener("click",doCheck);
var rt=null;
window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(layout,80); });
window.addEventListener("orientationchange",function(){ setTimeout(layout,300); });
document.addEventListener("keydown",function(e){
  if(e.key==="Enter") doCheck();
  if(e.key==="n"||e.key==="N") newProblem();
});

newProblem();
setTimeout(layout,80);
window.addEventListener("load",function(){ setTimeout(layout,60); });
</script>
</body>
</html>
